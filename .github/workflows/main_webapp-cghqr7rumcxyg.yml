name: Build and deploy ASP.Net Core app to Azure Web App - WebApp-cghqr7rumcxyg

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore CsvToJsonCore.csproj

      - name: Build
        run: dotnet build CsvToJsonCore.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish CsvToJsonCore.csproj --configuration Release --no-build --output "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp


  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9269DDCA9CF4404AAF4846971B1C1DA0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B7ADD5171246458CAA4BABC1244CE3F2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1D588A282DFF455E9C1426010CC8910A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'WebApp-cghqr7rumcxyg'
          slot-name: 'Production'
          package: .
